# ============================================================
# Nacos 配置：gym-auth 服务（DEFAULT_GROUP / dataId=gym-auth-dev.yml）
# 功能：统一认证登录 / Token 发放与刷新 / 登出注销 / Spring Security 配置
# ============================================================
server:
  port: 8082

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: gym-auth
  profiles:
    active: dev

# ========== MyBatis Plus 配置（认证服务本身不直接连 DB，通过 Feign 调 gym-user） ==========
  cloud:
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8720
# ========== Feign 调用 gym-user ==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/gym_user?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 3
      min-idle: 3
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1

# ========== Spring Security 配置 ==========

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gym.entity.user
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ========== 数据源：auth 相关可共用 gym_user 库 ==========
security:
  # 白名单路径（不需要认证即可访问）
  whitelist:
    - /auth/login
    - /auth/refresh
    - /auth/captcha
    - /actuator/**
    - /swagger-ui.html
    - /swagger-resources/**
    - /v3/api-docs/**
    - /doc.html
    - /webjars/**
    - /*.js
    - /*.css
    - /*.html
    - /favicon.ico

# ========== JWT 详细配置（可覆盖公共配置） ==========
gym:
  jwt:
    secret: "GymAuthJwtSecretKeySuperSecure2024xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    tokenPrefix: "Bearer "
    header: Authorization
    # access_token 有效期 2 小时
    accessTokenExpireMinutes: 120
    # refresh_token 有效期 7 天
    refreshTokenExpireDays: 7
    accessTokenRedisPrefix: "gym:auth:access:"
    refreshTokenRedisPrefix: "gym:auth:refresh:"
    # 登录失败锁定配置
    login:
      max-fail-count: 5
      lock-minutes: 30
      fail-count-prefix: "gym:auth:login:fail:"
      lock-key-prefix: "gym:auth:login:lock:"

# ========== 验证码配置（预留，如需要图形验证码） ==========
  captcha:
    enabled: false
    width: 120
    height: 40
    length: 4
    expire-minutes: 5

# Seata 事务分组统一由公共配置 application.yml 提供（default_tx_group -> default）

# ========== Sentinel 限流（登录接口防暴力破解） ==========
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: full
  httpclient:
    enabled: true

# ========== 日志级别 ==========
logging:
  level:
    com.gym.auth: DEBUG
    org.springframework.security: DEBUG

# ========== JWT（JwtUtil 使用） ==========
jwt:
  secret: "GymAuthJwtSecretKeySuperSecure2024xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  expire: 7200
