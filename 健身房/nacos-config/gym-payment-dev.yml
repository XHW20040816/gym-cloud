# ============================================================
# Nacos 配置：gym-payment 服务（DEFAULT_GROUP / dataId=gym-payment-dev.yml）
# 功能：策略模式多支付 / Seata 全局事务 / 分布式锁防重复支付
# ============================================================
server:
  port: 8090

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: gym-payment
  profiles:
    active: dev

# ========== MyBatis Plus 配置 ==========
  cloud:
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8728
# ========== Feign 配置（调用 order / member） ==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/gym_payment?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 30
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      validation-query: SELECT 1
      test-while-idle: true

# ========== 支付服务特有配置 ==========

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gym.entity.payment
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== 数据源：gym_payment 库 ==========
gym:
  payment:
    # 分布式锁（防重复支付）
    lock:
      prefix: "gym:pay:lock:"
      wait-seconds: 5
      lease-seconds: 60
    # 支付流水缓存
    cache:
      payment-prefix: "gym:pay:record:"
      expire-days: 30
    # 各支付渠道配置
    channel:
      # 余额支付
      balance:
        enabled: true
        name: 余额支付
      # 支付宝（Mock）
      alipay:
        enabled: true
        name: 支付宝支付
        mock-result: success
        appId: MOCK_ALIPAY_APPID
      # 微信支付（Mock）
      wxpay:
        enabled: true
        name: 微信支付
        mock-result: success
        appId: MOCK_WXPAY_APPID
    # 支付回调延迟（Mock 模拟）
    mock:
      callback-delay-seconds: 2

# Seata 事务分组统一由公共配置 application.yml 提供（default_tx_group -> default）

# ========== Sentinel 限流 ==========
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 30000
  httpclient:
    enabled: true

# ========== 日志级别 ==========
logging:
  level:
    com.gym.payment.mapper: DEBUG
    com.gym.payment.service: DEBUG
    com.gym.payment.strategy: DEBUG

# ========== JWT（JwtUtil 使用） ==========
jwt:
  secret: "${JWT_SECRET:GymAuthJwtSecretKeySuperSecure2024xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}"
  expire: 7200
