# ============================================================
# Nacos 配置：gym-coach 服务（DEFAULT_GROUP / dataId=gym-coach-dev.yml）
# 功能：教练管理 / 排班管理 / 评分 / 专长标签
# ============================================================
server:
  port: 8086

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: gym-coach
  profiles:
    active: dev

# ========== MyBatis Plus 配置 ==========
  cloud:
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8724
# ========== Feign 配置 ==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/gym_user?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 25
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      validation-query: SELECT 1
      test-while-idle: true

# ========== 教练服务特有配置 ==========

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gym.entity.user
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== 数据源：gym_coach（实际存储在 gym_user 库中，用户与教练同源） ==========
gym:
  coach:
    # 教练信息缓存
    cache:
      coach-prefix: "gym:coach:detail:"
      schedule-prefix: "gym:coach:schedule:"
      expire-hours: 12
    # 评分规则
    rating:
      min-score: 1
      max-score: 5
      # 评分更新权重（旧分*0.9 + 新分*0.1）
      weight-old: 0.9
      weight-new: 0.1
    # 排班冲突检测
    schedule:
      conflict-check-enabled: true
      # 两次课程最小间隔（分钟）
      min-interval-minutes: 30

# Seata 事务分组统一由公共配置 application.yml 提供（default_tx_group -> default）

# ========== Sentinel 限流 ==========
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
  httpclient:
    enabled: true

# ========== 日志级别 ==========
logging:
  level:
    com.gym.coach.mapper: DEBUG
    com.gym.coach.service: DEBUG

# ========== JWT（JwtUtil 使用） ==========
jwt:
  secret: "${JWT_SECRET:GymAuthJwtSecretKeySuperSecure2024xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}"
  expire: 7200
