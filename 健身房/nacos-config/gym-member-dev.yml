# ============================================================
# Nacos 配置：gym-member 服务（DEFAULT_GROUP / dataId=gym-member-dev.yml）
# 功能：会员卡管理 / 开通会员 / 余额扣款 / Feign 暴露扣款接口
# ============================================================
server:
  port: 8085

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: gym-member
  profiles:
    active: dev

# ========== MyBatis Plus 配置 ==========
  cloud:
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8723
# ========== Feign 配置 ==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/gym_member?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 25
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      validation-query: SELECT 1
      test-while-idle: true

# ========== 会员服务特有配置 ==========

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gym.entity.member
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== 数据源：gym_member 库 ==========
gym:
  member:
    # 会员卡 Redis 缓存
    cache:
      card-prefix: "gym:member:card:"
      user-member-prefix: "gym:member:user:"
      expire-days: 30
    # 余额扣款分布式锁
    balance:
      lock-prefix: "gym:member:balance:lock:"
      lock-wait-seconds: 5
      lock-lease-seconds: 10
    # 默认赠送体验天数
    default:
      trial-days: 7

# Seata 事务分组统一由公共配置 application.yml 提供（default_tx_group -> default）

# ========== Sentinel 限流 ==========
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
  httpclient:
    enabled: true

# ========== 日志级别 ==========
logging:
  level:
    com.gym.member.mapper: DEBUG
    com.gym.member.service: DEBUG

# ========== JWT（JwtUtil 使用） ==========
jwt:
  secret: "${JWT_SECRET:GymAuthJwtSecretKeySuperSecure2024xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}"
  expire: 7200
