# ============================================================
# Nacos 配置：gym-goods 服务（DEFAULT_GROUP / dataId=gym-goods-dev.yml）
# 功能：商品管理 / 分类管理 / 库存管理 / ES 同步消息发送
# ============================================================
server:
  port: 8083

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: gym-goods
  profiles:
    active: dev

# ========== MyBatis Plus 配置 ==========
  cloud:
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8721
# ========== Feign 配置 ==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/gym_goods?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 30
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false

# ========== RabbitMQ 商品同步交换器配置 ==========

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gym.entity.goods
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== 数据源：gym_goods 库 ==========
gym:
  goods:
    mq:
      exchange: goods.exchange.fanout
      sync-routing-key: goods.sync
    # 库存操作乐观锁重试
    stock:
      retry:
        max-attempts: 3
        delay-ms: 100
    # 商品 Redis 缓存
    cache:
      goods-prefix: "gym:goods:detail:"
      category-prefix: "gym:goods:category:"
      expire-hours: 24

# Seata 事务分组统一由公共配置 application.yml 提供（default_tx_group -> default）

# ========== Sentinel 限流 ==========
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
  httpclient:
    enabled: true

# ========== 日志级别 ==========
logging:
  level:
    com.gym.goods.mapper: DEBUG
    com.gym.goods.service: DEBUG
    com.gym.goods.message: DEBUG

# ========== JWT（JwtUtil 使用） ==========
jwt:
  secret: "${JWT_SECRET:GymAuthJwtSecretKeySuperSecure2024xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}"
  expire: 7200
