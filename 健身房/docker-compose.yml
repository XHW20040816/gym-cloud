version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gym-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower-case-table-names=1
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/conf:/etc/mysql/conf.d
      # initdb 目录按文件名升序执行：必须用 00/01 前缀保证先建库建表再插入种子数据
      - ../sql/init.sql:/docker-entrypoint-initdb.d/00-init.sql
      - ../sql/data.sql:/docker-entrypoint-initdb.d/01-data.sql
    restart: unless-stopped
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: gym-redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - ./docker/redis/redis.conf:/etc/redis/redis.conf
      - ./docker/redis/data:/data
    restart: unless-stopped
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: gym-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Shanghai
    volumes:
      - ./docker/rabbitmq/data:/var/lib/rabbitmq
      - ./docker/rabbitmq/log:/var/log/rabbitmq
    restart: unless-stopped
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  elasticsearch:
    image: elasticsearch:7.17.15
    container_name: gym-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - cluster.name=gym-es-cluster
      - node.name=gym-es-node-1
      - TZ=Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./docker/es/data:/usr/share/elasticsearch/data
      - ./docker/es/plugins:/usr/share/elasticsearch/plugins
      - ./docker/es/logs:/usr/share/elasticsearch/logs
    restart: unless-stopped
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  kibana:
    image: kibana:7.17.15
    container_name: gym-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN
      - TZ=Asia/Shanghai
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gym-network
    # Kibana 镜像未随 ES 一样自带 curl，健康检查改为 bash 的 /dev/tcp 端口探测（仅判断 5601 是否可连）
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5601' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: gym-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
      - TZ=Asia/Shanghai
    volumes:
      - ./docker/nacos/logs:/home/nacos/logs
      - ./docker/nacos/data:/home/nacos/data
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/v1/console/health/liveness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  seata-server:
    image: seataio/seata-server:1.7.1
    container_name: gym-seata-server
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      # Seata 注册到 Nacos 的地址必须「宿主机可访问」：Docker Desktop(Windows) 下容器 IP 172.x 宿主机不可达，
      # 而 127.0.0.1 会被 NetUtil 判定为回环地址后回落成容器 IP，因此使用宿主机 LAN IP。
      # 本机 IP 变化时：SEATA_IP=192.168.x.x docker compose up -d --force-recreate seata-server
      - SEATA_IP=${SEATA_IP:-192.168.1.3}
      - SEATA_PORT=8091
      - STORE_MODE=file
      - TZ=Asia/Shanghai
    volumes:
      - ./docker/seata/logs:/root/logs
      # 直接覆盖镜像内配置（1.7.1 的 jib 镜像通过 Spring Boot application.yml 读取 nacos 注册配置）
      - ./docker/seata/resources/application.yml:/seata-server/resources/application.yml
    depends_on:
      nacos:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gym-network
    healthcheck:
      # /health 需要登录鉴权，改为探活控制台首页（401 也说明 HTTP 已就绪）
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:7091/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: gym-sentinel-dashboard
    ports:
      - "8858:8858"
    environment:
      - PARAMS=--server.port=8858 --auth.enabled=false --csp.sentinel.dashboard.server=localhost:8858
      - JAVA_OPTS=-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard -Dauth.enabled=false
      - TZ=Asia/Shanghai
    command:
      - "--server.port=8858"
      - "--auth.enabled=false"
    restart: unless-stopped
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8858/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

networks:
  gym-network:
    driver: bridge
    name: gym-network
